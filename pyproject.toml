[project]
name = "realestate-assistant-lite"
version = "0.1.0"
description = "Simplified AI real estate assistant: natural-language property search, mortgage math, market stats."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
